servers:
- url: https://api.machines.dev/v1
tags:
- description: "This site hosts documentation generated from the Fly.io Machines API\
    \ OpenAPI specification. Visit our complete [Machines API docs](https://fly.io/docs/machines/api/apps-resource/)\
    \ for details about using the Apps resource."
  name: Apps
- description: "This site hosts documentation generated from the Fly.io Machines API\
    \ OpenAPI specification. Visit our complete [Machines API docs](https://fly.io/docs/machines/api/machines-resource/)\
    \ for details about using the Machines resource."
  name: Machines
- description: "This site hosts documentation generated from the Fly.io Machines API\
    \ OpenAPI specification. Visit our complete [Machines API docs](https://fly.io/docs/machines/api/volumes-resource/)\
    \ for details about using the Volumes resource."
  name: Volumes
paths:
  /apps:
    get:
      description: |
        List all apps with the ability to filter by organization slug.
      operationId: Apps_list
      parameters:
      - description: "The org slug, or 'personal', to filter apps"
        explode: true
        in: query
        name: org_slug
        required: true
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListAppsResponse"
          description: OK
      summary: List Apps
      tags:
      - Apps
    post:
      description: |
        Create an app with the specified details in the request body.
      operationId: Apps_create
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAppRequest"
        description: App body
        required: true
      responses:
        "201":
          content: {}
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Bad Request
      summary: Create App
      tags:
      - Apps
      x-codegen-request-body-name: request
  /apps/{app_name}:
    delete:
      description: |
        Delete an app by its name.
      operationId: Apps_delete
      parameters:
      - description: Fly App Name
        explode: false
        in: path
        name: app_name
        required: true
        schema:
          type: string
        style: simple
      responses:
        "202":
          content: {}
          description: Accepted
      summary: Destroy App
      tags:
      - Apps
    get:
      description: |
        Retrieve details about a specific app by its name.
      operationId: Apps_show
      parameters:
      - description: Fly App Name
        explode: false
        in: path
        name: app_name
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/App"
          description: OK
      summary: Get App
      tags:
      - Apps
  /apps/{app_name}/machines:
    get:
      description: |
        List all Machines associated with a specific app, with optional filters for including deleted Machines and filtering by region.
      operationId: Machines_list
      parameters:
      - description: Fly App Name
        explode: false
        in: path
        name: app_name
        required: true
        schema:
          type: string
        style: simple
      - description: Include deleted machines
        explode: true
        in: query
        name: include_deleted
        required: false
        schema:
          type: boolean
        style: form
      - description: Region filter
        explode: true
        in: query
        name: region
        required: false
        schema:
          type: string
        style: form
      - description: "comma separated list of states to filter (created, started,\
          \ stopped, suspended)"
        explode: true
        in: query
        name: state
        required: false
        schema:
          type: string
        style: form
      - description: "Only return summary info about machines (omit config, checks,\
          \ events, host_status, nonce, etc.)"
        explode: true
        in: query
        name: summary
        required: false
        schema:
          type: boolean
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/Machine"
                type: array
          description: OK
      summary: List Machines
      tags:
      - Machines
    post:
      description: |
        Create a Machine within a specific app using the details provided in the request body.

        **Important**: This request can fail, and you’re responsible for handling that failure. If you ask for a large Machine, or a Machine in a region we happen to be at capacity for, you might need to retry the request, or to fall back to another region. If you’re working directly with the Machines API, you’re taking some responsibility for your own orchestration!
      operationId: Machines_create
      parameters:
      - description: Fly App Name
        explode: false
        in: path
        name: app_name
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMachineRequest"
        description: Create machine request
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Machine"
          description: OK
      summary: Create Machine
      tags:
      - Machines
      x-codegen-request-body-name: request
  /apps/{app_name}/machines/{machine_id}:
    delete:
      description: |
        Delete a specific Machine within an app by Machine ID, with an optional force parameter to force kill the Machine if it's running.
      operationId: Machines_delete
      parameters:
      - description: Fly App Name
        explode: false
        in: path
        name: app_name
        required: true
        schema:
          type: string
        style: simple
      - description: Machine ID
        explode: false
        in: path
        name: machine_id
        required: true
        schema:
          type: string
        style: simple
      - description: Force kill the machine if it's running
        explode: true
        in: query
        name: force
        required: false
        schema:
          type: boolean
        style: form
      responses:
        "200":
          content: {}
          description: OK
      summary: Destroy Machine
      tags:
      - Machines
    get:
      description: |
        Get details of a specific Machine within an app by the Machine ID.
      operationId: Machines_show
      parameters:
      - description: Fly App Name
        explode: false
        in: path
        name: app_name
        required: true
        schema:
          type: string
        style: simple
      - description: Machine ID
        explode: false
        in: path
        name: machine_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Machine"
          description: OK
      summary: Get Machine
      tags:
      - Machines
    post:
      description: |
        Update a Machine's configuration using the details provided in the request body.
      operationId: Machines_update
      parameters:
      - description: Fly App Name
        explode: false
        in: path
        name: app_name
        required: true
        schema:
          type: string
        style: simple
      - description: Machine ID
        explode: false
        in: path
        name: machine_id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMachineRequest"
        description: Request body
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Machine"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Bad Request
      summary: Update Machine
      tags:
      - Machines
      x-codegen-request-body-name: request
  /apps/{app_name}/machines/{machine_id}/cordon:
    post:
      description: |
        “Cordoning” a Machine refers to disabling its services, so the Fly Proxy won’t route requests to it. In flyctl this is used by blue/green deployments; one set of Machines is started up with services disabled, and when they are all healthy, the services are enabled on the new Machines and disabled on the old ones.
      operationId: Machines_cordon
      parameters:
      - description: Fly App Name
        explode: false
        in: path
        name: app_name
        required: true
        schema:
          type: string
        style: simple
      - description: Machine ID
        explode: false
        in: path
        name: machine_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content: {}
          description: OK
      summary: Cordon Machine
      tags:
      - Machines
  /apps/{app_name}/machines/{machine_id}/events:
    get:
      description: |
        List all events associated with a specific Machine within an app.
      operationId: Machines_list_events
      parameters:
      - description: Fly App Name
        explode: false
        in: path
        name: app_name
        required: true
        schema:
          type: string
        style: simple
      - description: Machine ID
        explode: false
        in: path
        name: machine_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/MachineEvent"
                type: array
          description: OK
      summary: List Events
      tags:
      - Machines
  /apps/{app_name}/machines/{machine_id}/exec:
    post:
      description: |
        Execute a command on a specific Machine and return the raw command output bytes.
      operationId: Machines_exec
      parameters:
      - description: Fly App Name
        explode: false
        in: path
        name: app_name
        required: true
        schema:
          type: string
        style: simple
      - description: Machine ID
        explode: false
        in: path
        name: machine_id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MachineExecRequest"
        description: Request body
        required: true
      responses:
        "200":
          content:
            application/octet-stream:
              schema:
                $ref: "#/components/schemas/flydv1.ExecResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/flydv1.ExecResponse"
          description: "stdout, stderr, exit code, and exit signal are returned"
        "400":
          content:
            application/octet-stream:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Bad Request
      summary: Execute Command
      tags:
      - Machines
      x-codegen-request-body-name: request
  /apps/{app_name}/machines/{machine_id}/lease:
    delete:
      description: |
        Release the lease of a specific Machine within an app. Machine leases can be used to obtain an exclusive lock on modifying a Machine.
      operationId: Machines_release_lease
      parameters:
      - description: Fly App Name
        explode: false
        in: path
        name: app_name
        required: true
        schema:
          type: string
        style: simple
      - description: Machine ID
        explode: false
        in: path
        name: machine_id
        required: true
        schema:
          type: string
        style: simple
      - description: Existing lease nonce
        explode: false
        in: header
        name: fly-machine-lease-nonce
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content: {}
          description: OK
      summary: Release Lease
      tags:
      - Machines
    get:
      description: |
        Retrieve the current lease of a specific Machine within an app. Machine leases can be used to obtain an exclusive lock on modifying a Machine.
      operationId: Machines_show_lease
      parameters:
      - description: Fly App Name
        explode: false
        in: path
        name: app_name
        required: true
        schema:
          type: string
        style: simple
      - description: Machine ID
        explode: false
        in: path
        name: machine_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lease"
          description: OK
      summary: Get Lease
      tags:
      - Machines
    post:
      description: |
        Create a lease for a specific Machine within an app using the details provided in the request body. Machine leases can be used to obtain an exclusive lock on modifying a Machine.
      operationId: Machines_create_lease
      parameters:
      - description: Fly App Name
        explode: false
        in: path
        name: app_name
        required: true
        schema:
          type: string
        style: simple
      - description: Machine ID
        explode: false
        in: path
        name: machine_id
        required: true
        schema:
          type: string
        style: simple
      - description: "Existing lease nonce to refresh by ttl, empty or non-existent\
          \ to create a new lease"
        explode: false
        in: header
        name: fly-machine-lease-nonce
        required: false
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLeaseRequest"
        description: Request body
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lease"
          description: OK
      summary: Create Lease
      tags:
      - Machines
      x-codegen-request-body-name: request
  /apps/{app_name}/machines/{machine_id}/metadata:
    get:
      description: |
        Retrieve metadata for a specific Machine within an app.
      operationId: Machines_show_metadata
      parameters:
      - description: Fly App Name
        explode: false
        in: path
        name: app_name
        required: true
        schema:
          type: string
        style: simple
      - description: Machine ID
        explode: false
        in: path
        name: machine_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: OK
      summary: Get Metadata
      tags:
      - Machines
  /apps/{app_name}/machines/{machine_id}/metadata/{key}:
    delete:
      description: |
        Delete metadata for a specific Machine within an app by providing a metadata key.
      operationId: Machines_delete_metadata
      parameters:
      - description: Fly App Name
        explode: false
        in: path
        name: app_name
        required: true
        schema:
          type: string
        style: simple
      - description: Machine ID
        explode: false
        in: path
        name: machine_id
        required: true
        schema:
          type: string
        style: simple
      - description: Metadata Key
        explode: false
        in: path
        name: key
        required: true
        schema:
          type: string
        style: simple
      responses:
        "204":
          content: {}
          description: No Content
      summary: Delete Metadata
      tags:
      - Machines
    post:
      description: |
        Update metadata for a specific machine within an app by providing a metadata key.
      operationId: Machines_update_metadata
      parameters:
      - description: Fly App Name
        explode: false
        in: path
        name: app_name
        required: true
        schema:
          type: string
        style: simple
      - description: Machine ID
        explode: false
        in: path
        name: machine_id
        required: true
        schema:
          type: string
        style: simple
      - description: Metadata Key
        explode: false
        in: path
        name: key
        required: true
        schema:
          type: string
        style: simple
      responses:
        "204":
          content: {}
          description: No Content
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Bad Request
      summary: Update Metadata
      tags:
      - Machines
  /apps/{app_name}/machines/{machine_id}/ps:
    get:
      description: |
        List all processes running on a specific Machine within an app, with optional sorting parameters.
      operationId: Machines_list_processes
      parameters:
      - description: Fly App Name
        explode: false
        in: path
        name: app_name
        required: true
        schema:
          type: string
        style: simple
      - description: Machine ID
        explode: false
        in: path
        name: machine_id
        required: true
        schema:
          type: string
        style: simple
      - description: Sort by
        explode: true
        in: query
        name: sort_by
        required: false
        schema:
          type: string
        style: form
      - description: Order
        explode: true
        in: query
        name: order
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/ProcessStat"
                type: array
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Bad Request
      summary: List Processes
      tags:
      - Machines
  /apps/{app_name}/machines/{machine_id}/restart:
    post:
      description: |
        Restart a specific Machine within an app, with an optional timeout parameter.
      operationId: Machines_restart
      parameters:
      - description: Fly App Name
        explode: false
        in: path
        name: app_name
        required: true
        schema:
          type: string
        style: simple
      - description: Machine ID
        explode: false
        in: path
        name: machine_id
        required: true
        schema:
          type: string
        style: simple
      - description: Restart timeout as a Go duration string or number of seconds
        explode: true
        in: query
        name: timeout
        required: false
        schema:
          type: string
        style: form
      - description: Unix signal name
        explode: true
        in: query
        name: signal
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content: {}
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Bad Request
      summary: Restart Machine
      tags:
      - Machines
  /apps/{app_name}/machines/{machine_id}/signal:
    post:
      description: |
        Send a signal to a specific Machine within an app using the details provided in the request body.
      operationId: Machines_signal
      parameters:
      - description: Fly App Name
        explode: false
        in: path
        name: app_name
        required: true
        schema:
          type: string
        style: simple
      - description: Machine ID
        explode: false
        in: path
        name: machine_id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignalRequest"
        description: Request body
        required: true
      responses:
        "200":
          content: {}
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Bad Request
      summary: Signal Machine
      tags:
      - Machines
      x-codegen-request-body-name: request
  /apps/{app_name}/machines/{machine_id}/start:
    post:
      description: |
        Start a specific Machine within an app.
      operationId: Machines_start
      parameters:
      - description: Fly App Name
        explode: false
        in: path
        name: app_name
        required: true
        schema:
          type: string
        style: simple
      - description: Machine ID
        explode: false
        in: path
        name: machine_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content: {}
          description: OK
      summary: Start Machine
      tags:
      - Machines
  /apps/{app_name}/machines/{machine_id}/stop:
    post:
      description: |
        Stop a specific Machine within an app, with an optional request body to specify signal and timeout.
      operationId: Machines_stop
      parameters:
      - description: Fly App Name
        explode: false
        in: path
        name: app_name
        required: true
        schema:
          type: string
        style: simple
      - description: Machine ID
        explode: false
        in: path
        name: machine_id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StopRequest"
        description: Optional request body
        required: false
      responses:
        "200":
          content: {}
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Bad Request
      summary: Stop Machine
      tags:
      - Machines
      x-codegen-request-body-name: request
  /apps/{app_name}/machines/{machine_id}/suspend:
    post:
      description: |
        Suspend a specific Machine within an app. The next start operation will attempt (but is not guaranteed) to resume the Machine from a snapshot taken at suspension time, rather than performing a cold boot.
      operationId: Machines_suspend
      parameters:
      - description: Fly App Name
        explode: false
        in: path
        name: app_name
        required: true
        schema:
          type: string
        style: simple
      - description: Machine ID
        explode: false
        in: path
        name: machine_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content: {}
          description: OK
      summary: Suspend Machine
      tags:
      - Machines
  /apps/{app_name}/machines/{machine_id}/uncordon:
    post:
      description: |
        “Cordoning” a Machine refers to disabling its services, so the Fly Proxy won’t route requests to it. In flyctl this is used by blue/green deployments; one set of Machines is started up with services disabled, and when they are all healthy, the services are enabled on the new Machines and disabled on the old ones.
      operationId: Machines_uncordon
      parameters:
      - description: Fly App Name
        explode: false
        in: path
        name: app_name
        required: true
        schema:
          type: string
        style: simple
      - description: Machine ID
        explode: false
        in: path
        name: machine_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content: {}
          description: OK
      summary: Uncordon Machine
      tags:
      - Machines
  /apps/{app_name}/machines/{machine_id}/versions:
    get:
      description: |
        List all versions of the configuration for a specific Machine within an app.
      operationId: Machines_list_versions
      parameters:
      - description: Fly App Name
        explode: false
        in: path
        name: app_name
        required: true
        schema:
          type: string
        style: simple
      - description: Machine ID
        explode: false
        in: path
        name: machine_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/MachineVersion"
                type: array
          description: OK
      summary: List Versions
      tags:
      - Machines
  /apps/{app_name}/machines/{machine_id}/wait:
    get:
      description: |
        Wait for a Machine to reach a specific state. Specify the desired state with the state parameter. See the [Machine states table](https://fly.io/docs/machines/working-with-machines/#machine-states) for a list of possible states. The default for this parameter is `started`.

        This request will block for up to 60 seconds. Set a shorter timeout with the timeout parameter.
      operationId: Machines_wait
      parameters:
      - description: Fly App Name
        explode: false
        in: path
        name: app_name
        required: true
        schema:
          type: string
        style: simple
      - description: Machine ID
        explode: false
        in: path
        name: machine_id
        required: true
        schema:
          type: string
        style: simple
      - description: 26-character Machine version ID
        explode: true
        in: query
        name: instance_id
        required: false
        schema:
          type: string
        style: form
      - description: wait timeout. default 60s
        explode: true
        in: query
        name: timeout
        required: false
        schema:
          type: integer
        style: form
      - description: desired state
        explode: true
        in: query
        name: state
        required: false
        schema:
          enum:
          - started
          - stopped
          - suspended
          - destroyed
          type: string
        style: form
      responses:
        "200":
          content: {}
          description: OK
        "400":
          content:
            application/json:
              schema:
