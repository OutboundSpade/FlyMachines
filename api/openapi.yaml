components:
  schemas:
    App:
      example:
        organization:
          name: name
          slug: slug
        name: name
        id: id
        status: status
      properties:
        id:
          type: string
        name:
          type: string
        organization:
          $ref: "#/components/schemas/Organization"
        status:
          type: string
      type: object
    AppSecret:
      example:
        digest: digest
        name: name
        value: value
      properties:
        digest:
          type: string
        name:
          type: string
        value:
          type: string
      type: object
    AppSecrets:
      example:
        secrets:
        - digest: digest
          name: name
          value: value
        - digest: digest
          name: name
          value: value
      properties:
        secrets:
          items:
            $ref: "#/components/schemas/AppSecret"
          type: array
      type: object
    CheckStatus:
      example:
        output: output
        updated_at: updated_at
        name: name
        status: status
      properties:
        name:
          type: string
        output:
          type: string
        status:
          type: string
        updated_at:
          type: string
      type: object
    CreateAppRequest:
      example:
        app_name: app_name
        org_slug: org_slug
        enable_subdomains: true
        network: network
      properties:
        app_name:
          type: string
        enable_subdomains:
          type: boolean
        network:
          type: string
        org_slug:
          type: string
      type: object
    CreateLeaseRequest:
      example:
        description: description
        ttl: 0
      properties:
        description:
          type: string
        ttl:
          description: seconds lease will be valid
          type: integer
      type: object
    CreateMachineRequest:
      example:
        skip_secrets: true
        skip_service_registration: true
        lsvd: true
        name: name
        lease_ttl: 0
        region: region
        config: "{}"
        skip_launch: true
      properties:
        config:
          allOf:
          - $ref: "#/components/schemas/fly.MachineConfig"
          description: An object defining the Machine configuration
          type: object
        lease_ttl:
          type: integer
        lsvd:
          type: boolean
        name:
          description: "Unique name for this Machine. If omitted, one is generated\
            \ for you"
          type: string
        region:
          description: The target region. Omitting this param launches in the same
            region as your WireGuard peer connection (somewhere near you).
          type: string
        skip_launch:
          type: boolean
        skip_secrets:
          type: boolean
        skip_service_registration:
          type: boolean
      type: object
    CreateOIDCTokenRequest:
      description: Optional parameters
      example:
        aud: https://fly.io/org-slug
        aws_principal_tags: true
      properties:
        aud:
          example: https://fly.io/org-slug
          type: string
        aws_principal_tags:
          type: boolean
      type: object
    CreateVolumeRequest:
      example:
        compute:
          gpu_kind: gpu_kind
